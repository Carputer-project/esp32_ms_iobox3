; ESP32 MicroSquirt I/O box v3 (iobox3)
; 3x3 WROOM-32 module board. Reads MS2/Extra MicroSquirt outpc realtime CAN
; broadcast (base ID 0x5F0, 500kbps) and drives fan / IAC PWM (GPIO19 MOSFET) /
; 7 ULN2003A outputs (O1-O7 = 13,12,14,27,26,25,33) with an IO-box style fail-safe.
; Round display OPT-IN via 'P TFT 1' (offs by default so it can't clash with the
; iobox3 pin map — GPIO19 = TFT DC vs IAC). No switch inputs.
;
; Pin map (LOCKED 2026-08-09):
;   IAC/MOSFET gate = 19   CAN TX=5 RX=4   A1-A4 = 36,39,34,35   LED=2
;   TFT SCLK=15 MOSI=21 CS=22 DC=19
;
[env:esp32dev]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
; Pin arduino core 2.0.17: the shared framework package gets replaced by the
; dash project's pioarduino core 3.3.11 (ledcSetup/ledcAttachPin are core-2 API).
platform_packages =
	platformio/framework-arduinoespressif32 @ ~3.20017.0
build_flags =
	-DCORE_DEBUG_LEVEL=0
lib_deps =
	adafruit/Adafruit GFX Library@^1.11.11
	adafruit/Adafruit GC9A01A@^1.1.0
